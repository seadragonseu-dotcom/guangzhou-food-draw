<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">


    <title>
        今天吃什么 · 广州版
    </title>


    <meta name="description"
          content="广州美食随机推荐，和TA一起决定今天吃什么">


    <!-- CSS -->

    <link rel="stylesheet"
          href="css/main.css">


    <link rel="stylesheet"
          href="css/animation.css">


</head>



<body>


<div class="app">


    <!-- 顶部区域 -->

    <header class="header">


        <div class="logo">

            🍜

        </div>


        <h1>

            今天吃什么

        </h1>


        <p>

            广州美食随机推荐

        </p>


        <span>

            ❤️ 和TA一起吃点好的

        </span>


    </header>



    <!-- 模式选择 -->


    <!-- ==========================
     筛选条件
========================== -->


<section class="filter-card">


    <h2>
        🎯 推荐偏好
    </h2>


    <!-- 预算 -->

    <div class="filter-group">


        <label>
            💰 预算
        </label>


        <div class="filter-buttons">


            <button
            class="price-btn"
            data-price="50">

                ¥50以内

            </button>


            <button
            class="price-btn"
            data-price="100">

                ¥100以内

            </button>


            <button
            class="price-btn"
            data-price="200">

                ¥200以内

            </button>


            <button
            class="price-btn active"
            data-price="0">

                不限

            </button>


        </div>


    </div>





    <!-- 区域 -->


    <div class="filter-group">


        <label>
            📍 区域
        </label>


        <select id="districtSelect">


            <option value="">
                不限区域
            </option>


            <option value="天河">
                天河
            </option>


            <option value="越秀">
                越秀
            </option>


            <option value="海珠">
                海珠
            </option>


            <option value="荔湾">
                荔湾
            </option>


            <option value="番禺">
                番禺
            </option>


        </select>


    </div>





    <!-- 标签 -->


    <div class="filter-group">


        <label>
            🍜 类型
        </label>


        <div class="filter-buttons">


            <button
            class="tag-btn"
            data-tag="粤菜">

                粤菜

            </button>


            <button
            class="tag-btn"
            data-tag="火锅">

                火锅

            </button>


            <button
            class="tag-btn"
            data-tag="日料">

                日料

            </button>


            <button
            class="tag-btn"
            data-tag="烧烤">

                烧烤

            </button>


        </div>


    </div>



</section>





    <!-- 用餐时间 -->


    <section class="meal-section">


        <h2>

            今天吃什么时间？

        </h2>



        <div class="meal-buttons">


            <button
                    class="meal-btn active"
                    data-meal="早餐">

                🌅 早餐

            </button>



            <button
                    class="meal-btn"
                    data-meal="午餐">

                ☀️ 午餐

            </button>




            <button
                    class="meal-btn"
                    data-meal="晚餐">

                🌙 晚餐

            </button>



        </div>


    </section>





    <!-- 转盘区域 -->


    <section class="draw-section">


        <div class="wheel-container">


            <div id="wheel"
                 class="wheel">


                <div class="wheel-center">


                    <span id="wheelText">

                        START

                    </span>


                </div>


            </div>



        </div>



        <button
                id="drawButton"
                class="draw-button">


            🎰 开始抽签


        </button>



    </section>






    <!-- 推荐结果 -->


<!-- ==========================
推荐结果卡片
========================== -->


<section class="result-card">


    <div class="result-title">

        ❤️ 今日推荐

    </div>



    <h1 id="foodName">

        等待抽签

    </h1>



    <div class="result-info">


        <div class="info-item">

            🍜

            <span id="foodType">

            菜系

            </span>

        </div>



        <div class="info-item">

            📍

            <span id="foodDistrict">

            区域

            </span>

        </div>



        <div class="info-item">

            💰

            <span id="foodPrice">

            价格

            </span>

        </div>


    </div>




    <div class="score-box">


        <div>

            ⭐评分

            <strong id="foodRating">

            -

            </strong>

        </div>



        <div>

            ❤️情侣指数

            <strong id="foodCoupleScore">

            -

            </strong>

        </div>


    </div>





    <div class="business-box">


        🕒营业时间：

        <span id="foodHours">

        -

        </span>


    </div>





    <p id="foodDescription">


        推荐理由


    </p>





    <div class="result-buttons">

    <button id="mapButton">
    📍 查看地图
    </button>


    <button id="navigationButton">
    🚗 导航前往
    </button>


</div>


</section>






    <!-- 底部 -->

    <footer>


        <p>

            广州美食数据库 V2.0

        </p>


    </footer>



</div>





<!-- JavaScript -->

<script src="js/draw.js"></script>

<script src="js/app.js"></script>


</body>


</html>
