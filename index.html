<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">


    <title>
        今天吃什么 · 广州版
    </title>


    <meta name="description"
          content="广州美食随机推荐，和TA一起决定今天吃什么">


    <!-- CSS -->

    <link rel="stylesheet"
          href="css/main.css">


    <link rel="stylesheet"
          href="css/animation.css">


</head>



<body>


<div class="app">


    <!-- 顶部区域 -->

    <header class="header">


        <div class="logo">

            🍜

        </div>


        <h1>

            今天吃什么

        </h1>


        <p>

            广州美食随机推荐

        </p>


        <span>

            ❤️ 和TA一起吃点好的

        </span>


    </header>



    <!-- 模式选择 -->


    <section class="mode-card">


        <button
                id="coupleMode"
                class="mode-button">


            ❤️ 情侣模式开启


        </button>


    </section>





    <!-- 用餐时间 -->


    <section class="meal-section">


        <h2>

            今天吃什么时间？

        </h2>



        <div class="meal-buttons">


            <button
                    class="meal-btn active"
                    data-meal="早餐">

                🌅 早餐

            </button>



            <button
                    class="meal-btn"
                    data-meal="午餐">

                ☀️ 午餐

            </button>




            <button
                    class="meal-btn"
                    data-meal="晚餐">

                🌙 晚餐

            </button>



        </div>


    </section>





    <!-- 转盘区域 -->


    <section class="draw-section">


        <div class="wheel-container">


            <div id="wheel"
                 class="wheel">


                <div class="wheel-center">


                    <span id="wheelText">

                        START

                    </span>


                </div>


            </div>



        </div>



        <button
                id="drawButton"
                class="draw-button">


            🎰 开始抽签


        </button>



    </section>






    <!-- 推荐结果 -->


    <section class="result-card">


        <div class="result-header">


            <span>

                🎯 今日推荐

            </span>


        </div>




        <h2 id="foodName">

            等待抽签

        </h2>




        <div class="tags">


            <span id="foodType">

                菜系

            </span>


            <span id="foodDistrict">

                区域

            </span>



            <span id="foodPrice">

                人均

            </span>



        </div>





        <p id="foodDescription">


            点击开始抽签，让好运决定今天吃什么。


        </p>





        <div class="result-actions">


            <button
                    id="againButton">


                🔄 再抽一次


            </button>



            <button
                    id="favoriteButton">


                ❤️ 收藏


            </button>


        </div>



    </section>






    <!-- 底部 -->

    <footer>


        <p>

            广州美食数据库 V2.0

        </p>


    </footer>



</div>





<!-- JavaScript -->

<script src="js/draw.js"></script>

<script src="js/app.js"></script>


</body>


</html>
